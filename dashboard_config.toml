[dashboard]
title = "A+ Data Entry Activity"
subtitle = "Form completion reporting across BRISK, PRISM, and TRAIN"
cache_ttl_seconds = 600
minimum_refresh_seconds = 60
# Metadata, DAGs, and users change much less often than records and audit logs.
reference_cache_ttl_seconds = 86400
# Audit entries older than this window cannot be used for person/date attribution.
activity_lookback_days = 365

REDCAP_BRISK_API_URL= https://redcap.school.wakehealth.edu/api/
REDCAP_BRISK_API_TOKEN = 3AD4C73132F99216883104A16EE65120


REDCAP_PRISM_API_URL = https://redcap.school.wakehealth.edu/api/
REDCAP_PRISM_API_TOKE = 169D74BEDD1A04F57B219058B68ACD93


REDCAP_TRAIN_API_URL = https://redcap.school.wakehealth.edu/api/
REDCAP_TRAIN_API_TOKEN = FDDD655DD3B908C2C5DF555F6C6CBCF4

[access]
# This deployment currently presents the coordinator view. Before sharing with
# sites, enable private Connect Cloud sharing and add server-enforced email-to-site
# assignments. A browser dropdown is not an access control.
enforce_viewer_sites = false
coordinator_emails = []

[access.viewer_sites]
# "coordinator@example.org" = ["01", "12"]

# A form counts once for every record/event/repeat instance whose REDCap form
# status is currently Complete (raw value 2). Put instrument names—not labels—in
# excluded_forms to omit administrative or test forms from every total.



[[projects]]
id = "brisk"
label = "BRISK"
study_code = "01"
api_url_env = "REDCAP_BRISK_API_URL"
api_token_env = "REDCAP_BRISK_API_TOKEN"
excluded_forms = []

[[projects]]
id = "prism"
label = "PRISM"
study_code = "02"
api_url_env = "REDCAP_PRISM_API_URL"
api_token_env = "REDCAP_PRISM_API_TOKEN"
excluded_forms = []

[[projects]]
id = "train"
label = "TRAIN"
study_code = "03"
api_url_env = "REDCAP_TRAIN_API_URL"
api_token_env = "REDCAP_TRAIN_API_TOKEN"
excluded_forms = []
